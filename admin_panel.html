<!DOCTYPE html>
<html>
<head>
    <title>Reddy Admin</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0f;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .login-box {
            background: #12121a;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            margin: 100px auto;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #1a1a26;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
        }
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .sidebar {
            width: 200px;
            background: #12121a;
            position: fixed;
            height: 100%;
            padding: 20px;
        }
        .main {
            margin-left: 240px;
            padding: 20px;
        }
        .card {
            background: #12121a;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .stat {
            background: #12121a;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }
        .nav-btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            background: #1a1a26;
            text-align: left;
        }
        .nav-btn:hover {
            background: #7c3aed;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #1a1a26;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
        }
        .key-item {
            background: #1a1a26;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div id="loginDiv" class="login-box">
    <h2>👑 Reddy Admin</h2>
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="login()">Login</button>
</div>

<div id="appDiv" class="hidden">
    <div class="sidebar">
        <h3>REDDY</h3>
        <button class="nav-btn" onclick="loadDashboard()">📊 Dashboard</button>
        <button class="nav-btn" onclick="loadKeys()">🔑 Keys</button>
        <button class="nav-btn" onclick="loadPrices()">💰 Prices</button>
        <button class="nav-btn" onclick="loadOrders()">🛒 Orders</button>
        <button class="nav-btn" onclick="loadUsers()">👤 Users</button>
        <button class="nav-btn" onclick="logout()" style="margin-top:20px;background:#ef4444">Logout</button>
    </div>
    <div class="main" id="content">
        <h2>Welcome to Admin Panel</h2>
    </div>
</div>

<script>
let token = '';

async function login() {
    let pwd = document.getElementById('password').value;
    let res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
    });
    if (res.ok) {
        token = pwd;
        document.getElementById('loginDiv').classList.add('hidden');
        document.getElementById('appDiv').classList.remove('hidden');
        loadDashboard();
    } else {
        alert('Wrong password!');
    }
}

function logout() {
    token = '';
    document.getElementById('loginDiv').classList.remove('hidden');
    document.getElementById('appDiv').classList.add('hidden');
}

async function apiCall(endpoint, method = 'GET', body = null) {
    let opts = {
        method: method,
        headers: { 'Authorization': `Bearer ${token}` }
    };
    if (body) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
    }
    let res = await fetch('/api' + endpoint, opts);
    return res.json();
}

async function loadDashboard() {
    let data = await apiCall('/dashboard');
    document.getElementById('content').innerHTML = `
        <h2>Dashboard</h2>
        <div class="stats">
            <div class="stat">🔑 Keys<br><b>${data.total_keys}</b></div>
            <div class="stat">📦 Orders<br><b>${data.total_orders}</b></div>
            <div class="stat">👤 Users<br><b>${data.total_users}</b></div>
            <div class="stat">💰 Revenue<br><b>₹${data.total_revenue}</b></div>
        </div>
        <div class="card">
            <h3>Keys Stock</h3>
            <div id="stock"></div>
        </div>
    `;
    let keys = await apiCall('/keys/all');
    let html = '';
    for (let p in keys) {
        html += `<div><b>${p}</b> - Day:${keys[p].day.length} Week:${keys[p].week.length} Month:${keys[p].month.length}</div>`;
    }
    document.getElementById('stock').innerHTML = html;
}

async function loadKeys() {
    document.getElementById('content').innerHTML = `
        <h2>Key Manager</h2>
        <div class="card">
            <h3>Add Keys</h3>
            <select id="productSelect">
                <option value="deadeye">Deadeye</option>
                <option value="vision">Vision</option>
                <option value="rage">Rage</option>
                <option value="winios">Winios</option>
                <option value="kingios">Kingios</option>
            </select>
            <select id="durationSelect">
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
            </select>
            <textarea id="keysInput" rows="4" placeholder="Enter keys (one per line)"></textarea>
            <button onclick="addKeys()">Add Keys</button>
            <button onclick="generateKeys()">Generate 10 Keys</button>
        </div>
        <div class="card">
            <h3>Available Keys</h3>
            <div id="keysList"></div>
        </div>
    `;
    await refreshKeysList();
}

async function refreshKeysList() {
    let product = document.getElementById('productSelect')?.value || 'deadeye';
    let duration = document.getElementById('durationSelect')?.value || 'day';
    let data = await apiCall(`/keys/${product}/${duration}`);
    let keys = data.keys || [];
    let html = `<p>Total: ${keys.length} keys</p>`;
    for (let i = 0; i < keys.length; i++) {
        html += `<div class="key-item">🔑 ${keys[i]} <button onclick="deleteKey(${i})" style="float:right;background:#ef4444;padding:2px 10px;">Delete</button></div>`;
    }
    document.getElementById('keysList').innerHTML = html;
}

async function addKeys() {
    let product = document.getElementById('productSelect').value;
    let duration = document.getElementById('durationSelect').value;
    let raw = document.getElementById('keysInput').value;
    let keys = raw.split('\n').filter(k => k.trim().length > 0);
    if (keys.length === 0) {
        alert('Enter keys first!');
        return;
    }
    await apiCall('/keys', 'POST', { product, duration, keys });
    alert(`${keys.length} keys added!`);
    document.getElementById('keysInput').value = '';
    await refreshKeysList();
}

async function generateKeys() {
    let product = document.getElementById('productSelect').value;
    let duration = document.getElementById('durationSelect').value;
    let prefix = { deadeye: 'DEAD', vision: 'VIS', rage: 'RAGE', winios: 'WIN', kingios: 'KING' }[product];
    await apiCall('/keys/generate', 'POST', { product, duration, count: 10, prefix });
    alert('10 keys generated!');
    await refreshKeysList();
}

async function deleteKey(index) {
    let product = document.getElementById('productSelect').value;
    let duration = document.getElementById('durationSelect').value;
    let data = await apiCall(`/keys/${product}/${duration}`);
    let keys = data.keys || [];
    keys.splice(index, 1);
    await apiCall('/keys', 'POST', { product, duration, keys });
    await refreshKeysList();
}

async function loadPrices() {
    let prices = await apiCall('/prices');
    let html = '<h2>Price Manager</h2>';
    for (let [p, pr] of Object.entries(prices)) {
        html += `
            <div class="card">
                <h3>${p}</h3>
                Day: ₹<input type="number" id="price_${p}_day" value="${pr.day}"><br>
                Week: ₹<input type="number" id="price_${p}_week" value="${pr.week}"><br>
                Month: ₹<input type="number" id="price_${p}_month" value="${pr.month}"><br>
                <button onclick="updatePrice('${p}')">Save</button>
            </div>
        `;
    }
    document.getElementById('content').innerHTML = html;
}

async function updatePrice(product) {
    let day = document.getElementById(`price_${product}_day`).value;
    let week = document.getElementById(`price_${product}_week`).value;
    let month = document.getElementById(`price_${product}_month`).value;
    await apiCall('/prices', 'POST', {
        product: product,
        prices: { day: parseInt(day), week: parseInt(week), month: parseInt(month) }
    });
    alert('Price updated!');
}

async function loadOrders() {
    let orders = await apiCall('/orders');
    let html = '<h2>Orders</h2><div class="card">';
    if (orders.length === 0) {
        html += '<p>No orders yet</p>';
    } else {
        for (let o of orders.slice(0, 30)) {
            html += `<div>👤 ${o.username} - 📦 ${o.product} - ${o.duration} - ₹${o.amount} - 🔑 ${o.key} - 📅 ${o.date}</div><hr>`;
        }
    }
    html += '</div><button onclick="clearOrders()" style="background:#ef4444">Clear All Orders</button>';
    document.getElementById('content').innerHTML = html;
}

async function clearOrders() {
    if (confirm('Delete all orders?')) {
        await apiCall('/orders', 'DELETE');
        loadOrders();
        alert('Orders cleared');
    }
}

async function loadUsers() {
    let users = await apiCall('/users');
    let html = '<h2>Users</h2><div class="card">';
    for (let [id, u] of Object.entries(users)) {
        html += `<div>🆔 ${id} - 👤 @${u.username || 'unknown'} - 🔑 ${(u.keys || []).length} keys</div><hr>`;
    }
    document.getElementById('content').innerHTML = html;
}
</script>
</body>
</html>
