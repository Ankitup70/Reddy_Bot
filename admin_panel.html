<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Reddy Premium | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c1e 0%, #1a1535 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            position: fixed;
            height: 100vh;
            padding: 30px 20px;
            transition: all 0.3s;
            z-index: 100;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .logo p {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 6px 0;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item i {
            width: 24px;
            font-size: 18px;
        }

        .nav-item:hover {
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.5);
            color: #fff;
            transform: translateX(5px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 30px 40px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            color: #ef4444;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(124, 58, 237, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Cards */
        .card {
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: rgba(124, 58, 237, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: #fbbf24;
        }

        /* Forms */
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
            margin-bottom: 12px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.3);
        }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 14px;
            margin: 4px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        /* Product Tabs */
        .product-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .ptab {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .ptab:hover {
            background: rgba(124, 58, 237, 0.2);
            border-color: #7c3aed;
        }

        .ptab.active {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-color: transparent;
        }

        /* Duration Tabs */
        .dur-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .dtab {
            padding: 10px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .dtab.day {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .dtab.week {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            color: #f59e0b;
        }

        .dtab.month {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .dtab.active {
            transform: scale(1.05);
            box-shadow: 0 0 15px currentColor;
        }

        /* Keys List */
        .keys-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .key-item:hover {
            border-color: #7c3aed;
            transform: translateX(5px);
        }

        .key-code {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #10b981;
            font-weight: 600;
        }

        /* Price Grid */
        .price-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .price-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 16px;
            border-radius: 16px;
        }

        .price-item label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 12px;
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 12px;
            color: #94a3b8;
            font-weight: 500;
            font-size: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .data-table tr:hover td {
            background: rgba(124, 58, 237, 0.1);
        }

        /* Stock Grid */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .stock-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s;
        }

        .stock-card:hover {
            transform: translateY(-3px);
            border: 1px solid rgba(124, 58, 237, 0.5);
        }

        .stock-card .product-name {
            font-weight: 700;
            margin-bottom: 12px;
            color: #fbbf24;
        }

        .stock-stats {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
        }

        .day-count { color: #10b981; }
        .week-count { color: #f59e0b; }
        .month-count { color: #ef4444; }

        /* Login */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c1e, #1a1535);
        }

        .login-card {
            background: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-card h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .login-card input {
            margin-bottom: 20px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1535;
            border-left: 4px solid #10b981;
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .hidden {
            display: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: #7c3aed;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- Login Page -->
<div id="loginPage" class="login-container">
    <div class="login-card">
        <i class="fas fa-crown" style="font-size: 60px; color: #fbbf24; margin-bottom: 20px;"></i>
        <h1>REDDY PREMIUM</h1>
        <p>Admin Control Panel</p>
        <input type="password" id="passwordInput" placeholder="Enter Password" onkeypress="if(event.key==='Enter') login()">
        <button class="btn-primary" onclick="login()" style="width: 100%; padding: 14px;">🔓 Login to Dashboard</button>
    </div>
</div>

<!-- Main App -->
<div id="appPage" class="hidden">
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-crown" style="font-size: 40px; color: #fbbf24;"></i>
            <h1>REDDY PREMIUM</h1>
            <p>LICENSE SHOP ADMIN</p>
        </div>

        <div class="nav-item active" onclick="showPage('dashboard')">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="showPage('keys')">
            <i class="fas fa-key"></i>
            <span>Key Manager</span>
        </div>
        <div class="nav-item" onclick="showPage('prices')">
            <i class="fas fa-tag"></i>
            <span>Price Manager</span>
        </div>
        <div class="nav-item" onclick="showPage('orders')">
            <i class="fas fa-shopping-cart"></i>
            <span>Orders</span>
        </div>
        <div class="nav-item" onclick="showPage('users')">
            <i class="fas fa-users"></i>
            <span>Users</span>
        </div>

        <div style="position: absolute; bottom: 30px; width: calc(100% - 40px);">
            <div class="nav-item" onclick="logout()" style="color: #ef4444;">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h2 id="pageTitle">Dashboard</h2>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div id="contentArea"></div>
    </div>
</div>

<div id="toastMsg" class="toast hidden"></div>

<script>
let authToken = '';

async function login() {
    const password = document.getElementById('passwordInput').value;
    try {
        const response = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password })
        });
        if (response.ok) {
            authToken = password;
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('appPage').classList.remove('hidden');
            showPage('dashboard');
            showToast('✅ Login successful! Welcome back!', 'success');
        } else {
            showToast('❌ Wrong password! Try again.', 'error');
        }
    } catch(e) {
        showToast('❌ Login failed!', 'error');
    }
}

function logout() {
    authToken = '';
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('appPage').classList.add('hidden');
}

async function apiCall(endpoint, method = 'GET', body = null) {
    const options = {
        method: method,
        headers: {
            'Authorization': `Bearer ${authToken}`,
            'Content-Type': 'application/json'
        }
    };
    if (body) options.body = JSON.stringify(body);
    const response = await fetch('/api' + endpoint, options);
    if (!response.ok) throw new Error('API call failed');
    return response.json();
}

function showToast(message, type = 'info') {
    const toast = document.getElementById('toastMsg');
    toast.innerHTML = message;
    toast.style.borderLeftColor = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#f59e0b';
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3000);
}

function showPage(page) {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    event.target.closest('.nav-item').classList.add('active');
    
    const titles = { dashboard: 'Dashboard', keys: 'Key Manager', prices: 'Price Manager', orders: 'Orders', users: 'Users' };
    document.getElementById('pageTitle').innerHTML = titles[page];
    
    if (page === 'dashboard') loadDashboard();
    else if (page === 'keys') loadKeysUI();
    else if (page === 'prices') loadPricesUI();
    else if (page === 'orders') loadOrdersUI();
    else if (page === 'users') loadUsersUI();
}

async function loadDashboard() {
    const data = await apiCall('/dashboard');
    const keysData = await apiCall('/keys/all');
    
    let stockHtml = '';
    for (const [product, keys] of Object.entries(keysData)) {
        stockHtml += `
            <div class="stock-card">
                <div class="product-name">${product.toUpperCase()}</div>
                <div class="stock-stats">
                    <span class="day-count">🟢 ${keys.day.length}</span>
                    <span class="week-count">🟡 ${keys.week.length}</span>
                    <span class="month-count">🔴 ${keys.month.length}</span>
                </div>
            </div>
        `;
    }
    
    document.getElementById('contentArea').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon">🔑</div><div class="stat-value">${data.total_keys}</div><div class="stat-label">Total Keys</div></div>
            <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-value">${data.total_orders}</div><div class="stat-label">Total Orders</div></div>
            <div class="stat-card"><div class="stat-icon">👤</div><div class="stat-value">${data.total_users}</div><div class="stat-label">Total Users</div></div>
            <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value">₹${data.total_revenue.toLocaleString()}</div><div class="stat-label">Revenue</div></div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-database"></i> Keys Stock Overview</div>
            <div class="stock-grid">${stockHtml}</div>
        </div>
    `;
}

let currentProduct = 'deadeye';
let currentDuration = 'day';
const products = ['deadeye', 'vision', 'rage', 'winios', 'kingios'];
const productNames = { deadeye: 'Deadeye', vision: 'Vision', rage: 'Rage', winios: 'Winios', kingios: 'Kingios' };
const prefixes = { deadeye: 'DEAD', vision: 'VIS', rage: 'RAGE', winios: 'WIN', kingios: 'KING' };

function loadKeysUI() {
    document.getElementById('contentArea').innerHTML = `
        <div class="card">
            <div class="card-title"><i class="fas fa-plus-circle"></i> Add New Keys</div>
            <div class="product-tabs" id="productTabs"></div>
            <div class="dur-tabs">
                <div class="dtab day" onclick="setDuration('day',this)">🟢 Day</div>
                <div class="dtab week" onclick="setDuration('week',this)">🟡 Week</div>
                <div class="dtab month" onclick="setDuration('month',this)">🔴 Month</div>
            </div>
            <textarea id="keysInput" rows="4" placeholder="Enter keys (one per line)&#10;Example:&#10;DEAD-ABCD-1234-EFGH&#10;DEAD-WXYZ-5678-IJKL" style="resize: vertical;"></textarea>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-primary" onclick="addKeys()"><i class="fas fa-plus"></i> Add Keys</button>
                <button class="btn-success" onclick="generateKeys()"><i class="fas fa-magic"></i> Generate 10 Keys</button>
                <button class="btn-danger" onclick="clearPool()"><i class="fas fa-trash"></i> Clear Pool</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-list"></i> Available Keys (<span id="keyCount">0</span>)</div>
            <div id="keysList" class="keys-list"></div>
        </div>
    `;
    renderProductTabs();
    refreshKeysList();
}

function renderProductTabs() {
    let html = '';
    for (const p of products) {
        html += `<div class="ptab ${p === currentProduct ? 'active' : ''}" onclick="setProduct('${p}')">${productNames[p]}</div>`;
    }
    document.getElementById('productTabs').innerHTML = html;
}

function setProduct(product) {
    currentProduct = product;
    renderProductTabs();
    refreshKeysList();
}

function setDuration(duration, el) {
    currentDuration = duration;
    document.querySelectorAll('.dtab').forEach(d => d.classList.remove('active'));
    el.classList.add('active');
    refreshKeysList();
}

async function refreshKeysList() {
    const data = await apiCall(`/keys/${currentProduct}/${currentDuration}`);
    const keys = data.keys || [];
    document.getElementById('keyCount').innerHTML = keys.length;
    if (keys.length === 0) {
        document.getElementById('keysList').innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;">🔑 No keys in this pool. Add some above!</div>';
        return;
    }
    let html = '';
    for (let i = 0; i < keys.length; i++) {
        html += `
            <div class="key-item">
                <span class="key-code"><i class="fas fa-key"></i> ${keys[i]}</span>
                <button class="btn-danger" onclick="deleteKey(${i})" style="padding: 6px 15px;"><i class="fas fa-trash"></i> Delete</button>
            </div>
        `;
    }
    document.getElementById('keysList').innerHTML = html;
}

async function addKeys() {
    const input = document.getElementById('keysInput');
    const keys = input.value.split('\n').filter(k => k.trim().length > 0);
    if (keys.length === 0) {
        showToast('❌ Please enter at least one key!', 'error');
        return;
    }
    await apiCall('/keys', 'POST', { product: currentProduct, duration: currentDuration, keys });
    input.value = '';
    await refreshKeysList();
    showToast(`✅ ${keys.length} keys added successfully!`, 'success');
}

async function generateKeys() {
    await apiCall('/keys/generate', 'POST', {
        product: currentProduct,
        duration: currentDuration,
        count: 10,
        prefix: prefixes[currentProduct]
    });
    await refreshKeysList();
    showToast('🎲 10 keys generated successfully!', 'success');
}

async function deleteKey(index) {
    const data = await apiCall(`/keys/${currentProduct}/${currentDuration}`);
    const keys = data.keys || [];
    keys.splice(index, 1);
    await apiCall('/keys', 'POST', { product: currentProduct, duration: currentDuration, keys });
    await refreshKeysList();
    showToast('🗑️ Key deleted!', 'info');
}

async function clearPool() {
    if (!confirm(`⚠️ Delete ALL ${currentDuration} keys for ${productNames[currentProduct]}?`)) return;
    await apiCall(`/keys/${currentProduct}/${currentDuration}`, 'DELETE');
    await refreshKeysList();
    showToast('🗑️ Pool cleared!', 'info');
}

async function loadPricesUI() {
    const prices = await apiCall('/prices');
    let html = '';
    for (const [product, price] of Object.entries(prices)) {
        html += `
            <div class="card">
                <div class="card-title"><i class="fas fa-tag"></i> ${productNames[product]}</div>
                <div class="price-grid">
                    <div class="price-item"><label>🟢 Day Price</label><input type="number" id="price_${product}_day" value="${price.day}" min="1"></div>
                    <div class="price-item"><label>🟡 Week Price</label><input type="number" id="price_${product}_week" value="${price.week}" min="1"></div>
                    <div class="price-item"><label>🔴 Month Price</label><input type="number" id="price_${product}_month" value="${price.month}" min="1"></div>
                </div>
                <button class="btn-primary" onclick="updatePrice('${product}')"><i class="fas fa-save"></i> Save Changes</button>
            </div>
        `;
    }
    document.getElementById('contentArea').innerHTML = html;
}

async function updatePrice(product) {
    const prices = {
        day: parseInt(document.getElementById(`price_${product}_day`).value),
        week: parseInt(document.getElementById(`price_${product}_week`).value),
        month: parseInt(document.getElementById(`price_${product}_month`).value)
    };
    await apiCall('/prices', 'POST', { product, prices });
    showToast(`✅ ${productNames[product]} prices updated!`, 'success');
}

async function loadOrdersUI() {
    const orders = await apiCall('/orders');
    if (orders.length === 0) {
        document.getElementById('contentArea').innerHTML = `<div class="card"><div style="text-align: center; padding: 40px; color: #64748b;"><i class="fas fa-inbox" style="font-size: 48px;"></i><p>No orders yet</p></div></div>`;
        return;
    }
    let html = `<div class="card"><div class="card-title"><i class="fas fa-shopping-cart"></i> Order History</div>
        <button class="btn-danger" onclick="clearOrders()" style="margin-bottom: 20px;"><i class="fas fa-trash"></i> Clear All Orders</button>
        <table class="data-table"><thead><tr><th>User</th><th>Product</th><th>Duration</th><th>Amount</th><th>Key</th><th>Date</th></tr></thead><tbody>`;
    for (const o of orders.slice(0, 50)) {
        html += `<tr><td>@${o.username || '-'}</td><td>${o.product || '-'}</td><td>${o.duration || '-'}</td><td style="color: #10b981;">₹${o.amount || 0}</td><td><code>${o.key || '-'}</code></td><td>${o.date || '-'}</td></tr>`;
    }
    html += `</tbody></table></div>`;
    document.getElementById('contentArea').innerHTML = html;
}

async function clearOrders() {
    if (!confirm('⚠️ Delete ALL orders? This cannot be undone!')) return;
    await apiCall('/orders', 'DELETE');
    await loadOrdersUI();
    showToast('🗑️ All orders cleared!', 'info');
}

async function loadUsersUI() {
    const users = await apiCall('/users');
    const entries = Object.entries(users);
    if (entries.length === 0) {
        document.getElementById('contentArea').innerHTML = `<div class="card"><div style="text-align: center; padding: 40px; color: #64748b;"><i class="fas fa-users" style="font-size: 48px;"></i><p>No users yet</p></div></div>`;
        return;
    }
    let html = `<div class="card"><div class="card-title"><i class="fas fa-users"></i> Registered Users</div>
        <table class="data-table"><thead><tr><th>User ID</th><th>Username</th><th>Keys Purchased</th></tr></thead><tbody>`;
    for (const [id, user] of entries) {
        html += `<tr><td><code>${id}</code></td><td>@${user.username || 'Unknown'}</td><td><span style="color: #fbbf24;">${(user.keys || []).length} keys</span></td></tr>`;
    }
    html += `</tbody></table></div>`;
    document.getElementById('contentArea').innerHTML = html;
}
</script>
</body>
</html>
