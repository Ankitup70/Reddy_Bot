<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Reddy Premium | Enterprise Admin Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #0f0f1a 50%, #12121f 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(124, 58, 237, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Premium Sidebar */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, rgba(18, 18, 26, 0.98) 0%, rgba(10, 10, 15, 0.98) 100%);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(124, 58, 237, 0.2);
            position: fixed;
            height: 100vh;
            padding: 30px 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(124, 58, 237, 0.3);
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
        }

        .logo i {
            font-size: 48px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .logo p {
            font-size: 10px;
            color: #7c3aed;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 14px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.2), transparent);
            transition: left 0.5s;
        }

        .nav-item:hover::before {
            left: 100%;
        }

        .nav-item i {
            width: 24px;
            font-size: 18px;
        }

        .nav-item:hover {
            background: rgba(124, 58, 237, 0.1);
            border-color: rgba(124, 58, 237, 0.5);
            color: #fff;
            transform: translateX(5px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 30px 40px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .header h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #7c3aed20, #a855f720);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(124, 58, 237, 0.3);
        }

        .admin-badge i {
            color: #fbbf24;
            margin-right: 8px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 22px;
            border-radius: 12px;
            color: #ef4444;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.3);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(18, 18, 26, 0.9), rgba(26, 26, 38, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.1), transparent);
            border-radius: 50%;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(124, 58, 237, 0.5);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-icon {
            font-size: 36px;
            margin-bottom: 16px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-label {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Cards */
        .card {
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: rgba(124, 58, 237, 0.3);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title i {
            color: #fbbf24;
            font-size: 24px;
        }

        /* Forms */
        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
            margin-bottom: 16px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
        }

        button {
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 14px;
            margin: 4px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(124, 58, 237, 0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        /* Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(124, 58, 237, 0.5);
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .product-name {
            font-size: 18px;
            font-weight: 700;
            color: #fbbf24;
        }

        /* Sub Admin Grid */
        .subadmins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .subadmin-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 20px;
            padding: 20px;
        }

        .subadmin-role {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 20px;
            font-size: 11px;
            color: #a855f7;
            margin-top: 10px;
        }

        /* Keys List */
        .keys-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 14px 18px;
            margin: 8px 0;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .key-item:hover {
            border-color: #7c3aed;
            transform: translateX(5px);
        }

        .key-code {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #10b981;
            font-weight: 600;
        }

        .key-assigned {
            font-size: 11px;
            color: #fbbf24;
        }

        /* Product Tabs */
        .product-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .ptab {
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .ptab:hover {
            background: rgba(124, 58, 237, 0.2);
            border-color: #7c3aed;
            transform: translateY(-2px);
        }

        .ptab.active {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-color: transparent;
        }

        /* Duration Tabs */
        .dur-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .dtab {
            padding: 10px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .dtab.day {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .dtab.week {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            color: #f59e0b;
        }

        .dtab.month {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .dtab.active {
            transform: scale(1.05);
            box-shadow: 0 0 20px currentColor;
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 15px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .data-table tr:hover td {
            background: rgba(124, 58, 237, 0.1);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(135deg, #12121a, #1a1a26);
            padding: 40px;
            border-radius: 30px;
            width: 500px;
            max-width: 90%;
            border: 1px solid rgba(124, 58, 237, 0.3);
        }

        /* Login */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0f, #1a1535);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.3), transparent);
            border-radius: 50%;
            top: -150px;
            right: -150px;
        }

        .login-container::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2), transparent);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
        }

        .login-card {
            background: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 40px;
            text-align: center;
            width: 420px;
            border: 1px solid rgba(124, 58, 237, 0.3);
            z-index: 1;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #1a1535, #12121a);
            border-left: 4px solid #10b981;
            padding: 16px 28px;
            border-radius: 16px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .hidden {
            display: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- Login Page -->
<div id="loginPage" class="login-container">
    <div class="login-card">
        <i class="fas fa-crown" style="font-size: 70px; color: #fbbf24; margin-bottom: 20px;"></i>
        <h1 style="font-size: 32px; background: linear-gradient(135deg, #fff, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent;">REDDY PREMIUM</h1>
        <p style="color: #94a3b8; margin: 15px 0 30px;">Enterprise Admin Suite</p>
        <input type="password" id="passwordInput" placeholder="Enter Admin Password" style="margin-bottom: 20px;">
        <button class="btn-primary" onclick="login()" style="width: 100%; padding: 14px;"><i class="fas fa-lock-open"></i> Login to Dashboard</button>
    </div>
</div>

<!-- Main App -->
<div id="appPage" class="hidden">
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-crown"></i>
            <h1>REDDY PREMIUM</h1>
            <p>ENTERPRISE SUITE</p>
        </div>

        <div class="nav-item active" onclick="showPage('dashboard')">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="showPage('keys')">
            <i class="fas fa-key"></i>
            <span>Key Manager</span>
        </div>
        <div class="nav-item" onclick="showPage('products')">
            <i class="fas fa-boxes"></i>
            <span>Products</span>
        </div>
        <div class="nav-item" onclick="showPage('subadmins')" id="subadminNav">
            <i class="fas fa-user-shield"></i>
            <span>Sub Admins</span>
        </div>
        <div class="nav-item" onclick="showPage('customers')">
            <i class="fas fa-users"></i>
            <span>Customers</span>
        </div>
        <div class="nav-item" onclick="showPage('orders')">
            <i class="fas fa-shopping-cart"></i>
            <span>Orders</span>
        </div>

        <div style="position: absolute; bottom: 30px; width: calc(100% - 40px);">
            <div class="nav-item" onclick="logout()" style="color: #ef4444;">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h2 id="pageTitle">Dashboard</h2>
            <div class="admin-info">
                <div class="admin-badge">
                    <i class="fas fa-crown"></i>
                    <span id="adminRole">Super Admin</span>
                </div>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div id="contentArea"></div>
    </div>
</div>

<div id="toastMsg" class="toast hidden"></div>

<script>
// ============================================================
// DATA MODELS
// ============================================================
let currentAdmin = { id: 'super_admin', name: 'Super Admin', role: 'super' };
let admins = [
    { id: 'super_admin', username: 'super', password: 'reddy2024', role: 'super', name: 'Super Admin' }
];
let products = {
    "deadeye": { name: "Deadeye", emoji: "🎯", prefix: "DEAD", prices: { day: 149, week: 699, month: 1299 }, active: true },
    "vision": { name: "Vision", emoji: "👁️", prefix: "VIS", prices: { day: 199, week: 699, month: 2200 }, active: true },
    "rage": { name: "Rage", emoji: "⚡", prefix: "RAGE", prices: { day: 149, week: 699, month: 1299 }, active: true },
    "winios": { name: "Winios", emoji: "💻", prefix: "WIN", prices: { day: 149, week: 599, month: 999 }, active: true },
    "kingios": { name: "Kingios", emoji: "👑", prefix: "KING", prices: { day: 199, week: 699, month: 2200 }, active: true }
};

let keys = {};
let orders = [];
let customers = {};
let subAdmins = [];

// Initialize keys
for (let p in products) {
    keys[p] = { day: [], week: [], month: [] };
}

// ============================================================
// API FUNCTIONS
// ============================================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const options = {
        method: method,
        headers: { 'Content-Type': 'application/json' }
    };
    if (body) options.body = JSON.stringify(body);
    const response = await fetch('/api' + endpoint, options);
    if (!response.ok) throw new Error('API call failed');
    return response.json();
}

function showToast(message, type = 'success') {
    const toast = document.getElementById('toastMsg');
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
    toast.style.borderLeftColor = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#f59e0b';
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3000);
}

// ============================================================
// AUTHENTICATION
// ============================================================
async function login() {
    const password = document.getElementById('passwordInput').value;
    
    // Check super admin
    if (password === 'reddy2024') {
        currentAdmin = { id: 'super_admin', name: 'Super Admin', role: 'super' };
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('appPage').classList.remove('hidden');
        document.getElementById('adminRole').innerHTML = '<i class="fas fa-crown"></i> Super Admin';
        document.getElementById('subadminNav').style.display = 'flex';
        loadAllData();
        showToast('✅ Welcome back, Super Admin!', 'success');
        return;
    }
    
    // Check sub admins
    const subAdmin = admins.find(a => a.password === password && a.role === 'sub');
    if (subAdmin) {
        currentAdmin = subAdmin;
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('appPage').classList.remove('hidden');
        document.getElementById('adminRole').innerHTML = `<i class="fas fa-user-shield"></i> ${subAdmin.name}`;
        if (currentAdmin.role !== 'super') {
            document.getElementById('subadminNav').style.display = 'none';
        }
        loadAllData();
        showToast(`✅ Welcome, ${subAdmin.name}!`, 'success');
        return;
    }
    
    showToast('❌ Invalid credentials!', 'error');
}

function logout() {
    currentAdmin = { id: '', name: '', role: '' };
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('appPage').classList.add('hidden');
    document.getElementById('passwordInput').value = '';
}

// ============================================================
// LOAD DATA FROM SERVER
// ============================================================
async function loadAllData() {
    try {
        const db = await apiCall('/dashboard');
        // Load products from server
        const serverProducts = await apiCall('/prices');
        for (let p in serverProducts) {
            if (products[p]) {
                products[p].prices = serverProducts[p];
            }
        }
        
        const serverKeys = await apiCall('/keys/all');
        for (let p in serverKeys) {
            if (keys[p]) {
                keys[p] = serverKeys[p];
            }
        }
        
        const serverOrders = await apiCall('/orders');
        orders = serverOrders;
        
        const serverUsers = await apiCall('/users');
        customers = serverUsers;
        
        showPage('dashboard');
    } catch(e) {
        console.log('Using local data');
    }
}

// ============================================================
// UI FUNCTIONS
// ============================================================
function showPage(page) {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    event.target.closest('.nav-item').classList.add('active');
    
    const titles = {
        dashboard: 'Dashboard', keys: 'Key Manager', products: 'Product Manager',
        subadmins: 'Sub Admin Management', customers: 'Customers', orders: 'Orders'
    };
    document.getElementById('pageTitle').innerHTML = titles[page];
    
    if (page === 'dashboard') loadDashboard();
    else if (page === 'keys') loadKeysUI();
    else if (page === 'products') loadProductsUI();
    else if (page === 'subadmins') loadSubAdminsUI();
    else if (page === 'customers') loadCustomersUI();
    else if (page === 'orders') loadOrdersUI();
}

function loadDashboard() {
    let totalKeys = 0;
    for (let p in keys) {
        totalKeys += keys[p].day.length + keys[p].week.length + keys[p].month.length;
    }
    
    let totalRevenue = orders.reduce((sum, o) => sum + (o.amount || 0), 0);
    let totalCustomers = Object.keys(customers).length;
    
    document.getElementById('contentArea').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon">🔑</div><div class="stat-value">${totalKeys}</div><div class="stat-label">Total Keys in Stock</div></div>
            <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-value">${orders.length}</div><div class="stat-label">Total Orders</div></div>
            <div class="stat-card"><div class="stat-icon">👤</div><div class="stat-value">${totalCustomers}</div><div class="stat-label">Total Customers</div></div>
            <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value">₹${totalRevenue.toLocaleString()}</div><div class="stat-label">Total Revenue</div></div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-chart-pie"></i> Recent Activity</div>
            <canvas id="activityChart" style="max-height: 300px;"></canvas>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-trophy"></i> Top Products</div>
            <div id="topProducts"></div>
        </div>
    `;
    
    // Chart
    const ctx = document.getElementById('activityChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
            datasets: [{
                label: 'Orders',
                data: [12, 19, 15, 17, 14, 23, 21],
                borderColor: '#7c3aed',
                backgroundColor: 'rgba(124, 58, 237, 0.1)',
                tension: 0.4,
                fill: true
            }]
        },
        options: { responsive: true, maintainAspectRatio: true }
    });
    
    // Top Products
    let productSales = {};
    orders.forEach(o => { productSales[o.product] = (productSales[o.product] || 0) + 1; });
    let topHtml = '<div class="stats-grid">';
    for (let [p, count] of Object.entries(productSales).slice(0, 3)) {
        topHtml += `<div class="stat-card"><div class="stat-icon">${products[p]?.emoji || '📦'}</div><div class="stat-value">${count}</div><div class="stat-label">${p.toUpperCase()} Sales</div></div>`;
    }
    document.getElementById('topProducts').innerHTML = topHtml + '</div>';
}

// ============================================================
// KEY MANAGER UI
// ============================================================
let currentProduct = 'deadeye';
let currentDuration = 'day';

function loadKeysUI() {
    document.getElementById('contentArea').innerHTML = `
        <div class="card">
            <div class="card-title"><i class="fas fa-plus-circle"></i> Add New Keys</div>
            <div class="product-tabs" id="productTabs"></div>
            <div class="dur-tabs">
                <div class="dtab day" onclick="setDuration('day',this)">🟢 Day</div>
                <div class="dtab week" onclick="setDuration('week',this)">🟡 Week</div>
                <div class="dtab month" onclick="setDuration('month',this)">🔴 Month</div>
            </div>
            <textarea id="keysInput" rows="5" placeholder="Enter keys (one per line)&#10;Example:&#10;${products[currentProduct]?.prefix || 'PROD'}-ABCD-1234-EFGH&#10;${products[currentProduct]?.prefix || 'PROD'}-WXYZ-5678-IJKL" style="resize: vertical;"></textarea>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn-primary" onclick="addKeys()"><i class="fas fa-plus"></i> Add Keys</button>
                <button class="btn-success" onclick="generateKeys()"><i class="fas fa-magic"></i> Generate 10 Keys</button>
                <button class="btn-danger" onclick="clearPool()"><i class="fas fa-trash"></i> Clear Pool</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-list"></i> Available Keys (<span id="keyCount">0</span>)</div>
            <div id="keysList" class="keys-list"></div>
        </div>
    `;
    renderProductTabs();
    refreshKeysList();
}

function renderProductTabs() {
    let html = '';
    for (let [p, data] of Object.entries(products)) {
        if (data.active !== false) {
            html += `<div class="ptab ${p === currentProduct ? 'active' : ''}" onclick="setProduct('${p}')">${data.emoji} ${data.name}</div>`;
        }
    }
    document.getElementById('productTabs').innerHTML = html;
}

function setProduct(product) {
    currentProduct = product;
    renderProductTabs();
    refreshKeysList();
    document.getElementById('keysInput').placeholder = `Enter keys (one per line)\nExample:\n${products[product].prefix}-ABCD-1234-EFGH\n${products[product].prefix}-WXYZ-5678-IJKL`;
}

function setDuration(duration, el) {
    currentDuration = duration;
    document.querySelectorAll('.dtab').forEach(d => d.classList.remove('active'));
    el.classList.add('active');
    refreshKeysList();
}

async function refreshKeysList() {
    const data = await apiCall(`/keys/${currentProduct}/${currentDuration}`);
    const keyList = data.keys || [];
    document.getElementById('keyCount').innerHTML = keyList.length;
    
    if (keyList.length === 0) {
        document.getElementById('keysList').innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;"><i class="fas fa-key" style="font-size: 48px; margin-bottom: 10px; display: block;"></i>No keys in this pool. Add some above!</div>';
        return;
    }
    
    let html = '';
    for (let i = 0; i < keyList.length; i++) {
        html += `
            <div class="key-item">
                <div>
                    <span class="key-code"><i class="fas fa-key"></i> ${keyList[i]}</span>
                </div>
                <button class="btn-danger" onclick="deleteKey(${i})" style="padding: 6px 18px;"><i class="fas fa-trash"></i> Delete</button>
            </div>
        `;
    }
    document.getElementById('keysList').innerHTML = html;
}

async function addKeys() {
    const input = document.getElementById('keysInput');
    const keyList = input.value.split('\n').filter(k => k.trim().length > 0);
    if (keyList.length === 0) {
        showToast('❌ Please enter at least one key!', 'error');
        return;
    }
    await apiCall('/keys', 'POST', { product: currentProduct, duration: currentDuration, keys: keyList });
    input.value = '';
    await refreshKeysList();
    showToast(`✅ ${keyList.length} keys added to ${products[currentProduct].name} ${currentDuration} pool!`, 'success');
}

async function generateKeys() {
    const prefixes = { deadeye: 'DEAD', vision: 'VIS', rage: 'RAGE', winios: 'WIN', kingios: 'KING' };
    await apiCall('/keys/generate', 'POST', {
        product: currentProduct,
        duration: currentDuration,
        count: 10,
        prefix: prefixes[currentProduct] || 'KEY'
    });
    await refreshKeysList();
    showToast(`🎲 10 keys generated for ${products[currentProduct].name}!`, 'success');
}

async function deleteKey(index) {
    const data = await apiCall(`/keys/${currentProduct}/${currentDuration}`);
    const keyList = data.keys || [];
    keyList.splice(index, 1);
    await apiCall('/keys', 'POST', { product: currentProduct, duration: currentDuration, keys: keyList });
    await refreshKeysList();
    showToast('🗑️ Key deleted!', 'info');
}

async function clearPool() {
    if (!confirm(`⚠️ Delete ALL ${currentDuration} keys for ${products[currentProduct].name}? This cannot be undone!`)) return;
    await apiCall(`/keys/${currentProduct}/${currentDuration}`, 'DELETE');
    await refreshKeysList();
    showToast(`🗑️ ${products[currentProduct].name} ${currentDuration} pool cleared!`, 'info');
}

// ============================================================
// PRODUCT MANAGER UI
// ============================================================
function loadProductsUI() {
    let html = `
        <div class="card">
            <div class="card-title"><i class="fas fa-plus-circle"></i> Add New Product</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <input type="text" id="newProductId" placeholder="Product ID (e.g., newtool)">
                <input type="text" id="newProductName" placeholder="Product Name (e.g., New Tool)">
                <input type="text" id="newProductEmoji" placeholder="Emoji (e.g., 🚀)">
                <input type="text" id="newProductPrefix" placeholder="Key Prefix (e.g., NEW)">
                <input type="number" id="newProductDayPrice" placeholder="Day Price ₹">
                <input type="number" id="newProductWeekPrice" placeholder="Week Price ₹">
                <input type="number" id="newProductMonthPrice" placeholder="Month Price ₹">
            </div>
            <button class="btn-success" onclick="addNewProduct()" style="margin-top: 15px;"><i class="fas fa-plus"></i> Create Product</button>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-boxes"></i> Existing Products</div>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    `;
    document.getElementById('contentArea').innerHTML = html;
    renderProductsGrid();
}

function renderProductsGrid() {
    let html = '';
    for (let [id, p] of Object.entries(products)) {
        html += `
            <div class="product-card">
                <div class="product-header">
                    <span class="product-name">${p.emoji} ${p.name}</span>
                    <span style="font-size: 11px; background: rgba(124,58,237,0.2); padding: 4px 12px; border-radius: 20px;">${id}</span>
                </div>
                <div style="margin-bottom: 15px;">
                    <div><small style="color: #10b981;">Day:</small> <strong>₹${p.prices.day}</strong></div>
                    <div><small style="color: #f59e0b;">Week:</small> <strong>₹${p.prices.week}</strong></div>
                    <div><small style="color: #ef4444;">Month:</small> <strong>₹${p.prices.month}</strong></div>
                    <div><small>Prefix:</small> <code>${p.prefix}</code></div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-warning" onclick="editProduct('${id}')" style="flex:1; padding: 8px;"><i class="fas fa-edit"></i> Edit</button>
                    <button class="btn-danger" onclick="deleteProduct('${id}')" style="flex:1; padding: 8px;"><i class="fas fa-trash"></i> Delete</button>
                </div>
            </div>
        `;
    }
    document.getElementById('productsGrid').innerHTML = html;
}

function addNewProduct() {
    const id = document.getElementById('newProductId').value.toLowerCase().trim();
    const name = document.getElementById('newProductName').value.trim();
    const emoji = document.getElementById('newProductEmoji').value.trim() || '📦';
    const prefix = document.getElementById('newProductPrefix').value.toUpperCase().trim();
    const dayPrice = parseInt(document.getElementById('newProductDayPrice').value);
    const weekPrice = parseInt(document.getElementById('newProductWeekPrice').value);
    const monthPrice = parseInt(document.getElementById('newProductMonthPrice').value);
    
    if (!id || !name || !prefix || isNaN(dayPrice)) {
        showToast('❌ Please fill all required fields!', 'error');
        return;
    }
    
    products[id] = {
        name: name,
        emoji: emoji,
        prefix: prefix,
        prices: { day: dayPrice, week: weekPrice, month: monthPrice },
        active: true
    };
    keys[id] = { day: [], week: [], month: [] };
    
    // Sync with server
    apiCall('/prices', 'POST', { product: id, prices: products[id].prices });
    
    document.getElementById('newProductId').value = '';
    document.getElementById('newProductName').value = '';
    document.getElementById('newProductEmoji').value = '';
    document.getElementById('newProductPrefix').value = '';
    document.getElementById('newProductDayPrice').value = '';
    document.getElementById('newProductWeekPrice').value = '';
    document.getElementById('newProductMonthPrice').value = '';
    
    renderProductsGrid();
    showToast(`✅ Product "${name}" created successfully!`, 'success');
}

function editProduct(id) {
    const p = products[id];
    const newDay = prompt('Enter new Day price:', p.prices.day);
    const newWeek = prompt('Enter new Week price:', p.prices.week);
    const newMonth = prompt('Enter new Month price:', p.prices.month);
    
    if (newDay && newWeek && newMonth) {
        p.prices = { day: parseInt(newDay), week: parseInt(newWeek), month: parseInt(newMonth) };
        apiCall('/prices', 'POST', { product: id, prices: p.prices });
        renderProductsGrid();
        showToast(`✅ ${p.name} prices updated!`, 'success');
    }
}

function deleteProduct(id) {
    if (id === 'deadeye' || id === 'vision' || id === 'rage' || id === 'winios' || id === 'kingios') {
        showToast('❌ Cannot delete default products!', 'error');
        return;
    }
    if (confirm(`Delete "${products[id].name}" permanently?`)) {
        delete products[id];
        delete keys[id];
        renderProductsGrid();
        showToast(`🗑️ Product deleted!`, 'info');
    }
}

// ============================================================
// SUB ADMIN MANAGER UI
// ============================================================
function loadSubAdminsUI() {
    if (currentAdmin.role !== 'super') {
        document.getElementById('contentArea').innerHTML = '<div class="card"><div style="text-align: center; padding: 40px;"><i class="fas fa-lock" style="font-size: 48px;"></i><p>Access Denied. Super Admin only.</p></div></div>';
        return;
    }
    
    let html = `
        <div class="card">
            <div class="card-title"><i class="fas fa-user-plus"></i> Add New Sub Admin</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                <input type="text" id="subName" placeholder="Full Name">
                <input type="text" id="subUsername" placeholder="Username">
                <input type="text" id="subPassword" placeholder="Password">
                <select id="subPermissions">
                    <option value="keys">Key Management Only</option>
                    <option value="orders">Orders Only</option>
                    <option value="customers">Customers Only</option>
                    <option value="full">Full Access</option>
                </select>
            </div>
            <button class="btn-success" onclick="addSubAdmin()" style="margin-top: 15px;"><i class="fas fa-plus"></i> Create Sub Admin</button>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-user-shield"></i> Current Sub Admins</div>
            <div class="subadmins-grid" id="subAdminsGrid"></div>
        </div>
    `;
    document.getElementById('contentArea').innerHTML = html;
    renderSubAdminsGrid();
}

function renderSubAdminsGrid() {
    const subList = admins.filter(a => a.role === 'sub');
    if (subList.length === 0) {
        document.getElementById('subAdminsGrid').innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;">No sub admins yet. Add one above!</div>';
        return;
    }
    
    let html = '';
    for (let a of subList) {
        html += `
            <div class="subadmin-card">
                <i class="fas fa-user-circle" style="font-size: 48px; color: #7c3aed;"></i>
                <h3 style="margin: 10px 0;">${a.name}</h3>
                <p style="color: #94a3b8;">@${a.username}</p>
                <div class="subadmin-role">${a.permissions || 'Full Access'}</div>
                <button class="btn-danger" onclick="removeSubAdmin('${a.id}')" style="margin-top: 15px; width: 100%;"><i class="fas fa-trash"></i> Remove</button>
            </div>
        `;
    }
    document.getElementById('subAdminsGrid').innerHTML = html;
}

function addSubAdmin() {
    const name = document.getElementById('subName').value.trim();
    const username = document.getElementById('subUsername').value.trim();
    const password = document.getElementById('subPassword').value.trim();
    const permissions = document.getElementById('subPermissions').value;
    
    if (!name || !username || !password) {
        showToast('❌ Please fill all fields!', 'error');
        return;
    }
    
    admins.push({
        id: `sub_${Date.now()}`,
        name: name,
        username: username,
        password: password,
        role: 'sub',
        permissions: permissions
    });
    
    document.getElementById('subName').value = '';
    document.getElementById('subUsername').value = '';
    document.getElementById('subPassword').value = '';
    
    renderSubAdminsGrid();
    showToast(`✅ Sub Admin "${name}" created! Password: ${password}`, 'success');
}

function removeSubAdmin(id) {
    if (confirm('Remove this sub admin?')) {
        admins = admins.filter(a => a.id !== id);
        renderSubAdminsGrid();
        showToast('🗑️ Sub admin removed!', 'info');
    }
}

// ============================================================
// CUSTOMERS UI
// ============================================================
function loadCustomersUI() {
    const entries = Object.entries(customers);
    if (entries.length === 0) {
        document.getElementById('contentArea').innerHTML = '<div class="card"><div style="text-align: center; padding: 40px;"><i class="fas fa-users" style="font-size: 48px;"></i><p>No customers yet</p></div></div>';
        return;
    }
    
    let html = '<div class="card"><div class="card-title"><i class="fas fa-users"></i> Customer Directory</div>';
    html += '<table class="data-table"><thead><tr><th>User ID</th><th>Username</th><th>Keys Purchased</th><th>Recent Key</th></tr></thead><tbody>';
    for (let [id, user] of entries) {
        const keysList = user.keys || [];
        const lastKey = keysList[keysList.length - 1];
        html += `<tr>
            <td><code>${id}</code></td>
            <td>@${user.username || 'Unknown'}</td>
            <td><span style="color: #fbbf24;">${keysList.length} keys</span></td>
            <td><code style="font-size: 11px;">${lastKey ? lastKey.key : '-'}</code></td>
        </tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('contentArea').innerHTML = html;
}

// ============================================================
// ORDERS UI
// ============================================================
function loadOrdersUI() {
    if (orders.length === 0) {
        document.getElementById('contentArea').innerHTML = '<div class="card"><div style="text-align: center; padding: 40px;"><i class="fas fa-shopping-cart" style="font-size: 48px;"></i><p>No orders yet</p></div></div>';
        return;
    }
    
    let html = `<div class="card"><div class="card-title"><i class="fas fa-shopping-cart"></i> Order History</div>
        <button class="btn-danger" onclick="clearAllOrders()" style="margin-bottom: 20px;"><i class="fas fa-trash"></i> Clear All Orders</button>
        <table class="data-table"><thead><tr><th>User</th><th>Product</th><th>Duration</th><th>Amount</th><th>Key</th><th>Date</th></tr></thead><tbody>`;
    for (let o of orders.slice(0, 100)) {
        html += `<tr>
            <td>@${o.username || '-'}</td>
            <td>${o.product || '-'}</td>
            <td>${o.duration || '-'}</td>
            <td style="color: #10b981;">₹${o.amount || 0}</td>
            <td><code style="font-size: 11px;">${o.key || '-'}</code></td>
            <td style="font-size: 12px;">${o.date || '-'}</td>
        </tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('contentArea').innerHTML = html;
}

async function clearAllOrders() {
    if (!confirm('⚠️ Delete ALL orders permanently?')) return;
    await apiCall('/orders', 'DELETE');
    orders = [];
    loadOrdersUI();
    showToast('🗑️ All orders cleared!', 'info');
}

loadAllData();
