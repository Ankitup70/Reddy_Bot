<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Reddy Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #fff;
            padding: 16px;
        }
        .login-card {
            background: #12121a;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            margin: 80px auto;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #1a1a26;
            border: 1px solid #2a2a3d;
            border-radius: 12px;
            color: #fff;
            margin: 12px 0;
            font-size: 16px;
        }
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
        }
        .sidebar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            background: #12121a;
            padding: 12px;
            border-radius: 20px;
        }
        .nav-btn {
            background: #1a1a26;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            color: #94a3b8;
            font-size: 13px;
            flex: 1;
            min-width: 70px;
        }
        .nav-btn.active {
            background: #7c3aed;
            color: white;
        }
        .card {
            background: #12121a;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: #1a1a26;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #fbbf24;
        }
        .stat-label {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 5px;
        }
        .product-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .ptab {
            background: #1a1a26;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
        }
        .ptab.active {
            background: #7c3aed;
        }
        .dur-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .dtab {
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .dtab.day { background: #10b98120; border: 1px solid #10b981; color: #10b981; }
        .dtab.week { background: #f59e0b20; border: 1px solid #f59e0b; color: #f59e0b; }
        .dtab.month { background: #ef444420; border: 1px solid #ef4444; color: #ef4444; }
        .dtab.active { box-shadow: 0 0 10px currentColor; }
        textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a26;
            border: 1px solid #2a2a3d;
            border-radius: 12px;
            color: #fff;
            margin: 12px 0;
            font-size: 13px;
        }
        .key-item {
            background: #1a1a26;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
        }
        .btn-primary { background: #7c3aed; }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        .btn-warning { background: #f59e0b; }
        .hidden { display: none; }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a3d;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1a1a26;
            padding: 12px 16px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            border-left: 3px solid #10b981;
        }
    </style>
</head>
<body>

<div id="loginDiv" style="text-align: center; padding: 40px 20px;">
    <div class="login-card">
        <h2>👑 Reddy Admin</h2>
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<div id="appDiv" class="hidden">
    <div class="sidebar" id="sidebar">
        <button class="nav-btn active" onclick="showPage('dashboard')">📊</button>
        <button class="nav-btn" onclick="showPage('keys')">🔑</button>
        <button class="nav-btn" onclick="showPage('products')">📦</button>
        <button class="nav-btn" onclick="showPage('orders')">🛒</button>
        <button class="nav-btn" onclick="showPage('users')">👥</button>
        <button class="nav-btn" onclick="logout()" style="color:#ef4444">🚪</button>
    </div>
    <div id="content"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
let token = '';
let products = {};
let keysData = {};
let orders = [];
let users = {};

async function login() {
    let pwd = document.getElementById('password').value;
    if (pwd === 'reddy2024') {
        token = pwd;
        document.getElementById('loginDiv').classList.add('hidden');
        document.getElementById('appDiv').classList.remove('hidden');
        await loadAllData();
        showPage('dashboard');
        showToast('✅ Login successful!');
    } else {
        showToast('❌ Wrong password!', 'error');
    }
}

function logout() {
    token = '';
    document.getElementById('loginDiv').classList.remove('hidden');
    document.getElementById('appDiv').classList.add('hidden');
    document.getElementById('password').value = '';
}

async function loadAllData() {
    showLoading(true);
    try {
        const [pricesRes, keysRes, ordersRes, usersRes] = await Promise.all([
            fetch('/api/prices').then(r => r.json()),
            fetch('/api/keys/all').then(r => r.json()),
            fetch('/api/orders').then(r => r.json()),
            fetch('/api/users').then(r => r.json())
        ]);
        products = pricesRes;
        keysData = keysRes;
        orders = ordersRes;
        users = usersRes;
    } catch(e) {
        console.log('Error loading data');
    }
    showLoading(false);
}

function showLoading(show) {
    if (show) {
        document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading...</div></div>';
    }
}

function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.innerHTML = msg;
    toast.style.borderLeftColor = type === 'error' ? '#ef4444' : '#10b981';
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 2500);
}

async function showPage(page) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    if (page === 'dashboard') await loadDashboard();
    else if (page === 'keys') await loadKeysUI();
    else if (page === 'products') await loadProductsUI();
    else if (page === 'orders') await loadOrdersUI();
    else if (page === 'users') await loadUsersUI();
}

async function loadDashboard() {
    let totalKeys = 0;
    for (let p in keysData) {
        totalKeys += (keysData[p]?.day?.length || 0) + (keysData[p]?.week?.length || 0) + (keysData[p]?.month?.length || 0);
    }
    let totalRevenue = orders.reduce((sum, o) => sum + (o.amount || 0), 0);
    let userCount = Object.keys(users).length;
    
    document.getElementById('content').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value">${totalKeys}</div><div class="stat-label">Keys</div></div>
            <div class="stat-card"><div class="stat-value">${orders.length}</div><div class="stat-label">Orders</div></div>
            <div class="stat-card"><div class="stat-value">${userCount}</div><div class="stat-label">Users</div></div>
            <div class="stat-card"><div class="stat-value">₹${totalRevenue}</div><div class="stat-label">Revenue</div></div>
        </div>
        <div class="card">
            <h3 style="margin-bottom: 12px;">📊 Stock Overview</h3>
            <div id="stockList"></div>
        </div>
    `;
    
    let stockHtml = '';
    for (let p in keysData) {
        stockHtml += `<div style="margin-bottom: 12px;">
            <b>${p}</b> 🟢${keysData[p]?.day?.length || 0} 🟡${keysData[p]?.week?.length || 0} 🔴${keysData[p]?.month?.length || 0}
        </div>`;
    }
    document.getElementById('stockList').innerHTML = stockHtml;
}

// ==================== KEYS MANAGER ====================
let currentProduct = 'deadeye';
let currentDur = 'day';
const productList = ['deadeye', 'vision', 'rage', 'winios', 'kingios'];
const productNames = { deadeye:'Deadeye', vision:'Vision', rage:'Rage', winios:'Winios', kingios:'Kingios' };
const prefixes = { deadeye:'DEAD', vision:'VIS', rage:'RAGE', winios:'WIN', kingios:'KING' };

async function loadKeysUI() {
    document.getElementById('content').innerHTML = `
        <div class="card">
            <div class="product-tabs" id="productTabs"></div>
            <div class="dur-tabs">
                <div class="dtab day" onclick="setDur('day',this)">🟢 Day</div>
                <div class="dtab week" onclick="setDur('week',this)">🟡 Week</div>
                <div class="dtab month" onclick="setDur('month',this)">🔴 Month</div>
            </div>
            <textarea id="keysInput" rows="3" placeholder="Enter keys (one per line)"></textarea>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn-primary" onclick="addKeys()">➕ Add</button>
                <button class="btn-success" onclick="genKeys()">🎲 Generate 10</button>
                <button class="btn-danger" onclick="clearPool()">🗑️ Clear</button>
            </div>
            <div style="margin-top: 16px;">
                <h4>Available Keys (<span id="keyCount">0</span>)</h4>
                <div id="keysList"></div>
            </div>
        </div>
    `;
    renderProductTabs();
    await refreshKeysList();
}

function renderProductTabs() {
    let html = '';
    for (let p of productList) {
        html += `<div class="ptab ${p === currentProduct ? 'active' : ''}" onclick="setProduct('${p}')">${productNames[p]}</div>`;
    }
    document.getElementById('productTabs').innerHTML = html;
}

function setProduct(p) {
    currentProduct = p;
    renderProductTabs();
    refreshKeysList();
}

function setDur(d, el) {
    currentDur = d;
    document.querySelectorAll('.dtab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    refreshKeysList();
}

async function refreshKeysList() {
    try {
        const res = await fetch(`/api/keys/${currentProduct}/${currentDur}`);
        const data = await res.json();
        const keyList = data.keys || [];
        document.getElementById('keyCount').innerHTML = keyList.length;
        if (keyList.length === 0) {
            document.getElementById('keysList').innerHTML = '<div style="text-align:center;padding:20px;color:#64748b;">No keys</div>';
            return;
        }
        let html = '';
        for (let i = 0; i < keyList.length; i++) {
            html += `<div class="key-item"><code>${keyList[i]}</code><button class="btn-sm btn-danger" onclick="deleteKey(${i})">Del</button></div>`;
        }
        document.getElementById('keysList').innerHTML = html;
    } catch(e) {
        showToast('Error loading keys');
    }
}

async function addKeys() {
    const input = document.getElementById('keysInput');
    const keyList = input.value.split('\n').filter(k => k.trim().length > 0);
    if (keyList.length === 0) {
        showToast('Enter keys first!', 'error');
        return;
    }
    await fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product: currentProduct, duration: currentDur, keys: keyList })
    });
    input.value = '';
    await refreshKeysList();
    showToast(`✅ ${keyList.length} keys added!`);
}

async function genKeys() {
    await fetch('/api/keys/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product: currentProduct, duration: currentDur, count: 10, prefix: prefixes[currentProduct] })
    });
    await refreshKeysList();
    showToast('🎲 10 keys generated!');
}

async function deleteKey(index) {
    const res = await fetch(`/api/keys/${currentProduct}/${currentDur}`);
    const data = await res.json();
    const keyList = data.keys || [];
    keyList.splice(index, 1);
    await fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product: currentProduct, duration: currentDur, keys: keyList })
    });
    await refreshKeysList();
    showToast('🗑️ Key deleted');
}

async function clearPool() {
    if (!confirm('Delete all keys?')) return;
    await fetch(`/api/keys/${currentProduct}/${currentDur}`, { method: 'DELETE' });
    await refreshKeysList();
    showToast('Pool cleared');
}

// ==================== PRODUCTS ====================
async function loadProductsUI() {
    let html = '<div class="card"><h3>Products</h3>';
    for (let [id, p] of Object.entries(products)) {
        html += `
            <div style="margin-bottom: 16px; padding: 12px; background: #1a1a26; border-radius: 12px;">
                <b>${id.toUpperCase()}</b><br>
                🟢 Day: ₹${p.day} | 🟡 Week: ₹${p.week} | 🔴 Month: ₹${p.month}<br>
                <button class="btn-warning btn-sm" onclick="editProduct('${id}')">Edit Price</button>
            </div>
        `;
    }
    html += `<hr><h4>Add New Product</h4>
        <input type="text" id="newProductId" placeholder="Product ID" style="margin-bottom:8px">
        <input type="text" id="newProductName" placeholder="Product Name" style="margin-bottom:8px">
        <input type="text" id="newProductPrefix" placeholder="Prefix (e.g., NEW)" style="margin-bottom:8px">
        <div style="display:flex;gap:8px;">
            <input type="number" id="newDayPrice" placeholder="Day Price">
            <input type="number" id="newWeekPrice" placeholder="Week Price">
            <input type="number" id="newMonthPrice" placeholder="Month Price">
        </div>
        <button class="btn-success" onclick="addNewProduct()" style="margin-top:12px">Create Product</button>
    </div>`;
    document.getElementById('content').innerHTML = html;
}

async function editProduct(id) {
    const newDay = prompt('New Day price:', products[id].day);
    const newWeek = prompt('New Week price:', products[id].week);
    const newMonth = prompt('New Month price:', products[id].month);
    if (newDay && newWeek && newMonth) {
        await fetch('/api/prices', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product: id, prices: { day: parseInt(newDay), week: parseInt(newWeek), month: parseInt(newMonth) } })
        });
        await loadAllData();
        await loadProductsUI();
        showToast('✅ Price updated!');
    }
}

async function addNewProduct() {
    const id = document.getElementById('newProductId').value.trim().toLowerCase();
    const name = document.getElementById('newProductName').value.trim();
    const prefix = document.getElementById('newProductPrefix').value.trim().toUpperCase();
    const dayPrice = parseInt(document.getElementById('newDayPrice').value);
    const weekPrice = parseInt(document.getElementById('newWeekPrice').value);
    const monthPrice = parseInt(document.getElementById('newMonthPrice').value);
    
    if (!id || !name || !prefix || isNaN(dayPrice)) {
        showToast('Fill all fields!', 'error');
        return;
    }
    
    await fetch('/api/prices', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product: id, prices: { day: dayPrice, week: weekPrice, month: monthPrice } })
    });
    
    await loadAllData();
    await loadProductsUI();
    showToast(`✅ Product ${name} created!`);
}

// ==================== ORDERS ====================
async function loadOrdersUI() {
    if (orders.length === 0) {
        document.getElementById('content').innerHTML = '<div class="card">No orders yet</div>';
        return;
    }
    let html = '<div class="card"><h3>Orders</h3>';
    for (let o of orders.slice(0, 30)) {
        html += `<div style="padding: 10px; border-bottom: 1px solid #2a2a3d;">
            ${o.username} - ${o.product} - ₹${o.amount}<br>
            <small style="color:#94a3b8">${o.date || ''}</small>
            <code style="display:block;font-size:11px">${o.key || ''}</code>
        </div>`;
    }
    html += `<button class="btn-danger" onclick="clearAllOrders()" style="margin-top:12px">Clear All</button></div>`;
    document.getElementById('content').innerHTML = html;
}

async function clearAllOrders() {
    if (!confirm('Delete all orders?')) return;
    await fetch('/api/orders', { method: 'DELETE' });
    orders = [];
    await loadOrdersUI();
    showToast('Orders cleared');
}

// ==================== USERS ====================
async function loadUsersUI() {
    let entries = Object.entries(users);
    if (entries.length === 0) {
        document.getElementById('content').innerHTML = '<div class="card">No users yet</div>';
        return;
    }
    let html = '<div class="card"><h3>Users</h3>';
    for (let [id, u] of entries) {
        html += `<div style="padding: 10px; border-bottom: 1px solid #2a2a3d;">
            ${id} - @${u.username || 'unknown'}<br>
            <small>${(u.keys || []).length} keys purchased</small>
        </div>`;
    }
    html += '</div>';
    document.getElementById('content').innerHTML = html;
}

// Auto-refresh data every 30 seconds
setInterval(() => {
    if (token) loadAllData();
}, 30000);
</script>
</body>
</html>
