<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>👑 Reddy Premium | Enterprise Admin Suite v4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a26;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --accent: #7c3aed;
            --accent-light: #a855f7;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #a855f7);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            overflow-x: hidden;
        }

        /* Premium Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100vh;
            transition: var(--transition);
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text h2 {
            font-size: 18px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text p {
            font-size: 10px;
            color: var(--text-tertiary);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            margin: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item i {
            width: 22px;
            font-size: 16px;
        }

        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transform: translateX(5px);
        }

        .nav-item.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 24px 32px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title h1 {
            font-size: 28px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .page-title p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .admin-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-tertiary);
            padding: 8px 16px;
            border-radius: 12px;
        }

        .admin-avatar {
            width: 36px;
            height: 36px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 20px;
            border-radius: 10px;
            color: var(--danger);
            cursor: pointer;
            transition: var(--transition);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.1), transparent);
            border-radius: 50%;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stat-change {
            font-size: 12px;
            margin-top: 10px;
        }

        .stat-change.positive { color: var(--success); }
        .stat-change.negative { color: var(--danger); }

        /* Cards */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: var(--accent-light);
        }

        /* Forms */
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
        }

        .data-table td {
            padding: 14px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .data-table tr:hover td {
            background: var(--bg-tertiary);
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-tertiary);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .search-bar i {
            color: var(--text-tertiary);
        }

        .search-bar input {
            border: none;
            padding: 0;
            background: none;
            width: 200px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 20px;
            background: var(--bg-tertiary);
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
        }

        .tab.active {
            background: var(--accent-gradient);
            color: white;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 24px;
            width: 500px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* Toast Notification */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-secondary);
            border-left: 4px solid var(--success);
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: var(--card-shadow);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Login */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0f, #1a1535);
        }

        .login-card {
            background: var(--bg-secondary);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            width: 400px;
            border: 1px solid var(--border);
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden { display: none; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                position: fixed;
                z-index: 200;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="loginContainer" class="login-container">
    <div class="login-card">
        <div class="logo-icon" style="margin: 0 auto 20px; width: 60px; height: 60px;">
            <i class="fas fa-crown" style="font-size: 32px;"></i>
        </div>
        <h2 style="margin-bottom: 10px;">Reddy Premium</h2>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">Enterprise Admin Suite</p>
        <input type="password" id="loginPassword" placeholder="Enter Password" style="margin-bottom: 20px;">
        <button class="btn-primary" onclick="login()" style="width: 100%; padding: 14px;">🔓 Login to Dashboard</button>
    </div>
</div>

<div id="appContainer" class="hidden">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-crown"></i></div>
                <div class="logo-text">
                    <h2>REDDY PREMIUM</h2>
                    <p>Enterprise Suite v4.0</p>
                </div>
            </div>
        </div>

        <div class="nav-item active" onclick="showPage('dashboard')">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="showPage('keys')">
            <i class="fas fa-key"></i>
            <span>Key Manager</span>
        </div>
        <div class="nav-item" onclick="showPage('products')">
            <i class="fas fa-boxes"></i>
            <span>Products</span>
        </div>
        <div class="nav-item" onclick="showPage('admins')">
            <i class="fas fa-user-shield"></i>
            <span>Sub Admins</span>
        </div>
        <div class="nav-item" onclick="showPage('customers')">
            <i class="fas fa-users"></i>
            <span>Customers</span>
        </div>
        <div class="nav-item" onclick="showPage('orders')">
            <i class="fas fa-shopping-cart"></i>
            <span>Orders</span>
        </div>
        <div class="nav-item" onclick="showPage('analytics')">
            <i class="fas fa-chart-pie"></i>
            <span>Analytics</span>
        </div>
        <div class="nav-item" onclick="showPage('settings')">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </div>

        <div style="position: absolute; bottom: 20px; width: calc(100% - 40px); margin: 0 20px;">
            <div class="nav-item" onclick="logout()" style="color: var(--danger);">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="page-title">
                <h1 id="pageTitle">Dashboard</h1>
                <p id="pageSubtitle">Welcome back, Super Admin</p>
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="Search anything..." onkeyup="globalSearch()">
                </div>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <i class="fas fa-moon"></i>
                </div>
                <div class="admin-badge">
                    <div class="admin-avatar">
                        <i class="fas fa-crown" style="font-size: 14px;"></i>
                    </div>
                    <div>
                        <div style="font-size: 13px; font-weight: 600;" id="adminName">Super Admin</div>
                        <div style="font-size: 10px; color: var(--text-tertiary);" id="adminRole">Full Access</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div id="contentArea">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>
</div>

<div id="toast" class="toast-notification hidden"></div>

<script>
// ============================================================
// GLOBAL VARIABLES
// ============================================================
let authToken = '';
let currentTheme = 'dark';
let charts = {};
let allData = {
    products: {},
    keys: {},
    orders: [],
    users: {},
    admins: []
};

// ============================================================
// THEME MANAGEMENT
// ============================================================
function toggleTheme() {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    localStorage.setItem('theme', currentTheme);
    showToast(`🌓 ${currentTheme === 'dark' ? 'Dark' : 'Light'} mode activated`, 'info');
}

// ============================================================
// AUTHENTICATION
// ============================================================
async function login() {
    const password = document.getElementById('loginPassword').value;
    
    if (password === 'reddy2024') {
        authToken = password;
        document.getElementById('loginContainer').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');
        await loadAllData();
        showPage('dashboard');
        showToast('✅ Welcome back, Super Admin!', 'success');
    } else {
        showToast('❌ Wrong password!', 'error');
    }
}

function logout() {
    authToken = '';
    document.getElementById('loginContainer').classList.remove('hidden');
    document.getElementById('appContainer').classList.add('hidden');
    document.getElementById('loginPassword').value = '';
}

// ============================================================
// API CALLS
// ============================================================
async function apiCall(endpoint, method = 'GET', body = null) {
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) options.body = JSON.stringify(body);
    const response = await fetch('/api' + endpoint, options);
    if (!response.ok) throw new Error('API call failed');
    return response.json();
}

async function loadAllData() {
    try {
        allData.prices = await apiCall('/prices');
        allData.keys = await apiCall('/keys/all');
        allData.orders = await apiCall('/orders');
        allData.users = await apiCall('/users');
        
        for (let p in allData.prices) {
            allData.products[p] = {
                name: p.charAt(0).toUpperCase() + p.slice(1),
                prices: allData.prices[p],
                keys: allData.keys[p] || { day: [], week: [], month: [] }
            };
        }
    } catch(e) {
        console.log('Using local data');
    }
}

function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
    toast.style.borderLeftColor = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6';
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3000);
}

function globalSearch() {
    const searchTerm = document.getElementById('globalSearch').value.toLowerCase();
    if (!searchTerm) return;
    
    let results = [];
    
    // Search in products
    for (let p in allData.products) {
        if (p.toLowerCase().includes(searchTerm)) {
            results.push({ type: 'Product', name: p, details: allData.products[p] });
        }
    }
    
    // Search in orders
    allData.orders.forEach(o => {
        if (o.username?.toLowerCase().includes(searchTerm) || o.product?.toLowerCase().includes(searchTerm)) {
            results.push({ type: 'Order', name: o.product, details: o });
        }
    });
    
    // Search in users
    for (let [id, u] of Object.entries(allData.users)) {
        if (u.username?.toLowerCase().includes(searchTerm) || id.includes(searchTerm)) {
            results.push({ type: 'Customer', name: u.username, details: u });
        }
    }
    
    if (results.length > 0) {
        showToast(`🔍 Found ${results.length} results for "${searchTerm}"`, 'info');
    }
}

// ============================================================
// PAGE NAVIGATION
// ============================================================
function showPage(page) {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    event.target.closest('.nav-item').classList.add('active');
    
    const titles = {
        dashboard: 'Dashboard', keys: 'Key Manager', products: 'Product Manager',
        admins: 'Sub Admin Management', customers: 'Customer Directory',
        orders: 'Order History', analytics: 'Analytics & Reports', settings: 'System Settings'
    };
    
    document.getElementById('pageTitle').innerHTML = titles[page];
    
    if (page === 'dashboard') loadDashboard();
    else if (page === 'keys') loadKeysUI();
    else if (page === 'products') loadProductsUI();
    else if (page === 'admins') loadAdminsUI();
    else if (page === 'customers') loadCustomersUI();
    else if (page === 'orders') loadOrdersUI();
    else if (page === 'analytics') loadAnalyticsUI();
    else if (page === 'settings') loadSettingsUI();
}

// ============================================================
// DASHBOARD
// ============================================================
async function loadDashboard() {
    let totalKeys = 0, totalRevenue = 0;
    for (let p in allData.keys) {
        totalKeys += (allData.keys[p].day?.length || 0) + (allData.keys[p].week?.length || 0) + (allData.keys[p].month?.length || 0);
    }
    allData.orders.forEach(o => totalRevenue += o.amount || 0);
    
    const todayOrders = allData.orders.filter(o => {
        if (!o.date) return false;
        return o.date.includes(new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' }));
    }).length;
    
    document.getElementById('contentArea').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header"><div class="stat-icon"><i class="fas fa-key"></i></div></div>
                <div class="stat-value">${totalKeys.toLocaleString()}</div>
                <div class="stat-label">Total Keys in Stock</div>
                <div class="stat-change positive"><i class="fas fa-arrow-up"></i> +12% from last week</div>
            </div>
            <div class="stat-card">
                <div class="stat-header"><div class="stat-icon"><i class="fas fa-shopping-cart"></i></div></div>
                <div class="stat-value">${allData.orders.length.toLocaleString()}</div>
                <div class="stat-label">Total Orders</div>
                <div class="stat-change positive"><i class="fas fa-arrow-up"></i> +${todayOrders} today</div>
            </div>
            <div class="stat-card">
                <div class="stat-header"><div class="stat-icon"><i class="fas fa-users"></i></div></div>
                <div class="stat-value">${Object.keys(allData.users).length.toLocaleString()}</div>
                <div class="stat-label">Total Customers</div>

let currentProduct = 'deadeye';
let currentDuration = 'day';
const productList = ['deadeye', 'vision', 'rage', 'winios', 'kingios'];
const productNames = { deadeye: 'Deadeye', vision: 'Vision', rage: 'Rage', winios: 'Winios', kingios: 'Kingios' };
const prefixes = { deadeye: 'DEAD', vision: 'VIS', rage: 'RAGE', winios: 'WIN', kingios: 'KING' };

function loadKeysUI() {
    document.getElementById('contentArea').innerHTML = `
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-plus-circle"></i> Add New Keys</div>
            </div>

                <div class="tab ${currentDuration === 'day' ? 'active' : ''}" onclick="setDuration('day')">🟢 Day</div>
                <div class="tab ${currentDuration === 'week' ? 'active' : ''}" onclick="setDuration('week')">🟡 Week</div>
                <div class="tab ${currentDuration === 'month' ? 'active' : ''}" onclick="setDuration('month')">🔴 Month</div>
            </div>
            <textarea id="keysInput" rows="5" placeholder="Enter keys (one per line)&#10;Example:&#10;${prefixes[currentProduct]}-ABCD-1234-EFGH" style="resize: vertical; margin-bottom: 15px;"></textarea>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn-primary" onclick="addKeys()"><i class="fas fa-plus"></i> Add Keys</button>
                <button class="btn-success" onclick="generateKeys()"><i class="fas fa-magic"></i> Generate 10 Keys</button>
                <button class="btn-danger" onclick="clearPool()"><i class="fas fa-trash"></i> Clear Pool</button>
                <button class="btn-outline" onclick="exportKeys()"><i class="fas fa-download"></i> Export Keys</button>
            </div>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-list"></i> Available Keys (<span id="keyCount">0</span>)</div>
                <div class="search-bar" style="width: auto;">
                    <i class="fas fa-search"></i>
                    <input type="text" id="keySearch" placeholder="Search keys..." onkeyup="filterKeys()" style="width: 150px;">
                </div>
            </div>
            <div id="keysList" class="keys-list" style="max-height: 400px; overflow-y: auto;"></div>
            <div style="margin-top: 15px; text-align: center;">
                <button class="btn-outline" onclick="copyAllKeys()"><i class="fas fa-copy"></i> Copy All Keys</button>
            </div>
        </div>
    `;
    renderProductTabs();
    refreshKeysList();
}

function renderProductTabs() {
    let html = '';
    for (let p of productList) {
        html += `<div class="tab ${p === currentProduct ? 'active' : ''}" onclick="setProduct('${p}')">${productNames[p]}</div>`;
    }
    document.getElementById('productTabs').innerHTML = html;
}

function setProduct(p) {
    currentProduct = p;
    renderProductTabs();
    refreshKeysList();
    document.getElementById('keysInput').placeholder = `Enter keys (one per line)\nExample:\n${prefixes[p]}-ABCD-1234-EFGH`;
}

function setDuration(d) {
    currentDuration = d;
    document.querySelectorAll('#contentArea .tabs .tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    refreshKeysList();
}

async function refreshKeysList() {
    const data = await apiCall(`/keys/${currentProduct}/${currentDuration}`);
    const keysList = data.keys || [];
    document.getElementById('keyCount').innerHTML = keysList.length;
    
    if (keysList.length === 0) {
        document.getElementById('keysList').innerHTML = '<div style="text-align: center; padding: 40px;"><i class="fas fa-key" style="font-size: 48px; opacity: 0.3;"></i><p style="margin-top: 10px;">No keys in this pool</p></div>';
        return;
    }
    
    let html = '';
    for (let i = 0; i < keysList.length; i++) {
        html += `
            <div class="key-item" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-tertiary); border-radius: 12px; margin-bottom: 8px;">
                <div><i class="fas fa-key" style="color: var(--success);"></i> <code>${keysList[i]}</code></div>
                <button class="btn-danger" onclick="deleteKey(${i})" style="padding: 6px 15px;"><i class="fas fa-trash"></i></button>
            </div>
        `;
    }
    document.getElementById('keysList').innerHTML = html;
}

async function addKeys() {
    const input = document.getElementById('keysInput');
    const keysList = input.value.split('\n').filter(k => k.trim().length > 0);
    if (keysList.length === 0) {
        showToast('❌ Please enter at least one key!', 'error');
        return;
    }
    await apiCall('/keys', 'POST', { product: currentProduct, duration: currentDuration, keys: keysList });
    input.value = '';
    await refreshKeysList();
    showToast(`✅ ${keysList.length} keys added to ${productNames[currentProduct]} ${currentDuration}!`, 'success');
}

async function generateKeys() {
    await apiCall('/keys/generate', 'POST', {
        product: currentProduct,
        duration: currentDuration,
        count: 10,
        prefix: prefixes[currentProduct]
    });
    await refreshKeysList();
    showToast(`🎲 10 keys generated for ${productNames[currentProduct]}!`, 'success');
}

async function deleteKey(index) {
    const data = await apiCall(`/keys/${currentProduct}/${currentDuration}`);
    const keysList = data.keys || [];
    keysList.splice(index, 1);
    await apiCall('/keys', 'POST', { product: currentProduct, duration: currentDuration, keys: keysList });
    await refreshKeysList();
    showToast('🗑️ Key deleted!', 'info');
}

async function clearPool() {
    if (!confirm(`⚠️ Delete ALL ${currentDuration} keys for ${productNames[currentProduct]}?`)) return;
    await apiCall(`/keys/${currentProduct}/${currentDuration}`, 'DELETE');
    await refreshKeysList();
    showToast(`🗑️ ${productNames[currentProduct]} ${currentDuration} pool cleared!`, 'info');
}

function filterKeys() {
    const search = document.getElementById('keySearch').value.toLowerCase();
    const items = document.querySelectorAll('.key-item');
    items.forEach(item => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(search) ? 'flex' : 'none';
    });
}

function copyAllKeys() {
    const items = document.querySelectorAll('.key-item code');
    const keys = Array.from(items).map(item => item.innerText).join('\n');
    navigator.clipboard.writeText(keys);
    showToast(`📋 Copied ${items.length} keys to clipboard!`, 'success');
}

function exportKeys() {
    showToast('📥 Export feature coming soon!', 'info');
}

async function addNewProduct() {
    const id = document.getElementById('newProductId').value.toLowerCase().trim();
    const name = document.getElementById('newProductName').value.trim();
    const emoji = document.getElementById('newProductEmoji').value.trim() || '📦';
    const prefix = document.getElementById('newProductPrefix').value.toUpperCase().trim();
    const dayPrice = parseInt(document.getElementById('newProductDayPrice').value);
    const weekPrice = parseInt(document.getElementById('newProductWeekPrice').value);
    const monthPrice = parseInt(document.getElementById('newProductMonthPrice').value);
    
    if (!id || !name || !prefix || isNaN(dayPrice)) {
        showToast('❌ Please fill all required fields!', 'error');
        return;
    }
    
    allData.products[id] = { name, prices: { day: dayPrice, week: weekPrice, month: monthPrice } };
    allData.keys[id] = { day: [], week: [], month: [] };
    
    await apiCall('/prices', 'POST', { product: id, prices: allData.products[id].prices });
    
    document.getElementById('newProductId').value = '';
    document.getElementById('newProductName').value = '';
    document.getElementById('newProductEmoji').value = '';
    document.getElementById('newProductPrefix').value = '';
    document.getElementById('newProductDayPrice').value = '';
    document.getElementById('newProductWeekPrice').value = '';
    document.getElementById('newProductMonthPrice').value = '';
    
    renderProductsGrid();
    showToast(`✅ Product "${name}" created successfully!`, 'success');
}

async function editProductPrices(id) {
    const p = allData.products[id];
    const newDay = prompt('Enter new Day price:', p.prices.day);
    const newWeek = prompt('Enter new Week price:', p.prices.week);
    const newMonth = prompt('Enter new Month price:', p.prices.month);
    
    if (newDay && newWeek && newMonth) {
        p.prices = { day: parseInt(newDay), week: parseInt(newWeek), month: parseInt(newMonth) };
        await apiCall('/prices', 'POST', { product: id, prices: p.prices });
        renderProductsGrid();
        showToast(`✅ ${p.name} prices updated!`, 'success');
    }
}

        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(search) ? 'block' : 'none';

                <tbody id="ordersBody"></tbody>
            </table>
            <div style="margin-top: 20px; text-align: center;">
                <button class="btn-outline" onclick="exportOrders()"><i class="fas fa-download"></i> Export Orders (CSV)</button>
                <button class="btn-outline" onclick="generateInvoice()"><i class="fas fa-file-pdf"></i> Generate Report</button>
            </div>
        </div>
    `;
    document.getElementById('contentArea').innerHTML = html;
    renderOrdersTable();
}

function renderOrdersTable() {
    let html = '';
    for (let i = 0; i < allData.orders.length; i++) {
        const o = allData.orders[i];
        html += `<tr>
            <td>${allData.orders.length - i}</td>
            <td>@${o.username || '-'}</td>
            <td>${o.product || '-'}</td>
            <td><span style="color: ${o.duration === 'day' ? '#10b981' : o.duration === 'week' ? '#f59e0b' : '#ef4444'}">${o.duration || '-'}</span></td>
            <td style="color: var(--success); font-weight: 600;">₹${o.amount || 0}</td>
            <td><code style="font-size: 11px;">${o.key || '-'}</code></td>
            <td style="font-size: 12px;">${o.date || '-'}</td>
        </tr>`;
    }
    document.getElementById('ordersBody').innerHTML = html;
}

function filterOrders() {
    const search = document.getElementById('orderSearch').value.toLowerCase();
    const rows = document.querySelectorAll('#ordersTable tbody tr');
    rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(search) ? '' : 'none';
    });
}

async function clearAllOrders() {
    if (!confirm('⚠️ Delete ALL orders permanently? This cannot be undone!')) return;
    await apiCall('/orders', 'DELETE');
    allData.orders = [];
    loadOrdersUI();
    showToast('🗑️ All orders cleared!', 'info');
}

function exportOrders() {
    let csv = "Order#,User,Product,Duration,Amount,Key,Date\n";
    for (let i = 0; i < allData.orders.length; i++) {
        const o = allData.orders[i];
        csv += `${i + 1},${o.username},${o.product},${o.duration},${o.amount},${o.key},${o.date}\n`;
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `orders_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📥 Orders exported successfully!', 'success');
}

function generateInvoice() {
    showToast('📄 Generating PDF report...', 'info');
    setTimeout(() => {
        showToast('📄 PDF report feature coming soon!', 'info');
    }, 1000);
}

// ============================================================
// ANALYTICS UI
// ============================================================
function loadAnalyticsUI() {
    let totalRevenue = allData.orders.reduce((sum, o) => sum + (o.amount || 0), 0);
    let productSales = {};
    allData.orders.forEach(o => { productSales[o.product] = (productSales[o.product] || 0) + 1; });
    
    document.getElementById('contentArea').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value">${((totalRevenue / 100000) * 100).toFixed(1)}%</div><div class="stat-label">Growth Rate</div></div>
            <div class="stat-card"><div class="stat-value">${Math.round(totalRevenue / (allData.orders.length || 1))}</div><div class="stat-label">Avg Order Value</div></div>
            <div class="stat-card"><div class="stat-value">${Object.keys(allData.users).length}</div><div class="stat-label">Customer Base</div></div>
            <div class="stat-card"><div class="stat-value">${allData.orders.length}</div><div class="stat-label">Total Transactions</div></div>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-chart-pie"></i> Sales Distribution</div>
            </div>
            <canvas id="salesChart" style="max-height: 300px;"></canvas>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-chart-bar"></i> Performance Metrics</div>
            </div>
            <div id="metrics"></div>
        </div>
    `;
    
    // Sales Chart
    const ctx = document.getElementById('salesChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: Object.keys(productSales),
            datasets: [{
                data: Object.values(productSales),
                backgroundColor: ['#7c3aed', '#10b981', '#f59e0b', '#ef4444', '#3b82f6']
            }]
        },
        options: { responsive: true }
    });
    
    // Metrics
    let metricsHtml = '<div class="stats-grid">';
    for (let [p, count] of Object.entries(productSales)) {
        let revenue = allData.orders.filter(o => o.product === p).reduce((sum, o) => sum + (o.amount || 0), 0);
        metricsHtml += `<div class="stat-card">
            <div class="stat-value">${count}</div>
            <div class="stat-label">${p} Sales</div>
            <div style="font-size: 12px; margin-top: 5px;">₹${revenue.toLocaleString()}</div>
        </div>`;
    }
    document.getElementById('metrics').innerHTML = metricsHtml + '</div>';
}

function backupDatabase() {
    const dataStr = JSON.stringify({ products: allData.products, keys: allData.keys, orders: allData.orders, users: allData.users }, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `reddy_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📥 Database backup created!', 'success');
}

function restoreDatabase() {
    showToast('📤 Click the file input to restore', 'info');
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = async (e) => {
        const file = e.target.files[0];
        const text = await file.text();
        const data = JSON.parse(text);
        if (data.products) allData.products = data.products;
        if (data.keys) allData.keys = data.keys;
        if (data.orders) allData.orders = data.orders;
        if (data.users) allData.users = data.users;
        showToast('✅ Database restored!', 'success');
        location.reload();
    };
    input.click();
}

function resetDatabase() {
    if (confirm('⚠️ RESET entire database? This will delete ALL data!')) {
        allData = { products: {}, keys: {}, orders: [], users: {}, admins: [] };
        showToast('🔄 Database reset!', 'info');
        location.reload();
    }
}

function saveSettings() {
    showToast('✅ Settings saved!', 'success');
}

if (savedTheme) {
    currentTheme = savedTheme;
    document.documentElement.setAttribute('data-theme', currentTheme);
}

loadAllData();
